<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Custom Data Generator with Template</title>
    <link rel="stylesheet" href="../../Css/DataGenerator.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
  </head>
  <body>
    <!-- Back to Home Button -->
    <a class="home-button" href="../webProfile.html">
      <i class="fas fa-home"></i>
      <span>Back to project list</span>
    </a>

    <div class="container" role="main" aria-label="Custom Data Generator">
      <h1>Custom Data Generator</h1>

      <section aria-labelledby="fieldsHeader">
        <h2 id="fieldsHeader">Define Data Fields</h2>
        <div id="fields"></div>
        <button id="addFieldBtn" type="button" aria-label="Add new field">
          Add Field
        </button>
      </section>

      <section aria-labelledby="templateHeader">
        <h2 id="templateHeader">Output Template</h2>
        <div class="controls">
          <div>
            <label for="templateSelector">Format:</label>
            <select id="templateSelector" aria-label="Output format template">
              <option value="json">JSON</option>
              <option value="sql">SQL Insert</option>
              <option value="csv">CSV</option>
              <option value="custom">Custom</option>
            </select>
          </div>
          <div>
            <label for="recordCount">Records:</label>
            <input
              type="number"
              id="recordCount"
              value="5"
              min="1"
              max="1000"
              aria-label="Number of records to generate"
            />
          </div>
        </div>

        <textarea
          id="templateInput"
          spellcheck="false"
          aria-label="Custom template editor"
        ></textarea>

        <button id="generateBtn" type="button" aria-label="Generate data">
          Generate
        </button>
      </section>

      <section aria-labelledby="outputHeader" id="outputSection">
        <h2 id="outputHeader">Generated Data</h2>
        <button id="copyBtn" type="button" aria-label="Copy to clipboard">
          Copy
        </button>
        <div id="output">
          <pre id="outputPre"></pre>
        </div>
      </section>
    </div>

    <script src="../../Js/DataGenerator.js"></script>
  </body>
</html>
