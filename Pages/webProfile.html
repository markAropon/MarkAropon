<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Profile</title>
    <link rel="stylesheet" href="../Css/webProfile.css" />
    <link rel="icon" href="../favicon.ico" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <header>
      <div class="imageHolder">
        <img src="../Css//Assets/profile.jpg" alt="My profile" />
      </div>

      <div class="titleHolder">
        <h1>Mark James B. Aropon</h1>
        <hr />
        <p>Web Developer | Designer | Programmer</p>
      </div>

    <section class="projects">
      <h2>My projects</h2>
      <div class="projectsContainer">
        <div

          id="Agreemo"

        <div

        </div>

          id="API_Tester"

        >
          <h4>API Tester</h4>
        </div>
        <div
          class="projectCards DataGenerator"
          id="DataGenerator"
          onclick="window.location.href='../Pages/Projects/DataGenerator.html'"
        >
          <h4>Data Generator</h4>
        </div>
        <div
          class="projectCards BootstrapClass"
          id="BootstrapClass"
          onclick="window.location.href='../Pages/Projects/bootstrapClass.html'"

    <script src="../Js/webProfile.js"></script>
    <!-- Home Button -->
    <a class="home-button" href="../Pages/HomePage.html">
      <i class="fas fa-home"></i>
